name: Render source protection

on:
  pull_request:
    paths:
      - .github/workflows/render-source-protection.yml
      - Cargo.toml
      - Cargo.lock
      - crates/engine/**
      - crates/project/src/render_queue.rs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Source guard (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: cargo test --locked -p effectcraft-engine --lib output_guard::tests
      - run: cargo test --locked -p effectcraft-engine --lib tests_render_overwrite
      - run: cargo test --locked -p effectcraft-project render_queue::tests
